
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jangan Sedih 🥺</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 15% 15%,
          #f0e5ff 0%,
          transparent 35%
        ),
        radial-gradient(
          circle at 85% 85%,
          #d8c0ff 0%,
          transparent 40%
        ),
        #cdb4f4;
    }

    .container {
      width: 90%;
      max-width: 500px;

      padding: 35px 25px;

      background: rgba(255, 255, 255, 0.90);

      border-radius: 30px;

      text-align: center;

      box-shadow:
        0 20px 50px rgba(80, 45, 130, 0.25);

      position: relative;
      z-index: 2;

      animation: masuk 0.6s ease;
    }

    @keyframes masuk {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .character {
      font-size: 85px;
      margin-bottom: 15px;

      animation: goyang 2.5s ease-in-out infinite;
    }

    @keyframes goyang {

      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-8px) rotate(3deg);
      }
    }

    h1 {
      color: #68429b;
      font-size: 27px;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #76647f;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    button {
      border: none;

      padding: 13px 22px;

      margin: 6px;

      border-radius: 20px;

      font-size: 15px;
      font-weight: bold;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    button:hover {
      transform: scale(1.08);

      box-shadow:
        0 8px 20px rgba(90, 55, 140, 0.20);
    }

    button:active {
      transform: scale(0.96);
    }

    .sad {
      background: #c9aff0;
      color: #4e3472;
    }

    .happy {
      background: #dfd1f7;
      color: #65469a;
    }

    .hug {
      background: #b795e5;
      color: white;
    }

    .message {
      display: none;

      margin-top: 22px;

      padding: 20px;

      border-radius: 20px;

      background: #f3edff;

      color: #69557b;

      line-height: 1.7;

      animation: masuk 0.4s ease;
    }

    .ending {
      font-size: 23px;

      font-weight: bold;

      color: #7046a8;
    }

    .heart {
      position: fixed;

      bottom: -40px;

      font-size: 24px;

      pointer-events: none;

      z-index: 1;

      animation:
        naik linear forwards;
    }

    @keyframes naik {

      0% {
        transform:
          translateY(0)
          rotate(0deg);

        opacity: 1;
      }

      100% {
        transform:
          translateY(-110vh)
          rotate(360deg);

        opacity: 0;
      }
    }

    .footer {
      margin-top: 20px;

      font-size: 12px;

      color: #a18abb;
    }

    @media (max-width: 480px) {

      .container {
        width: 92%;

        padding:
          30px
          18px;

        border-radius: 25px;
      }

      .character {
        font-size: 75px;
      }

      h1 {
        font-size: 24px;
      }

      .subtitle {
        font-size: 14px;
      }

      button {
        font-size: 14px;

        padding:
          12px
          18px;
      }

    }

  </style>
</head>


<body>


  <div class="container">

    <div
      class="character"
      id="character"
    >
      🥺
    </div>


    <h1 id="title">
      Hei... kamu lagi sedih ya?
    </h1>


    <p
      class="subtitle"
      id="subtitle"
    >
      Kok mukanya begitu sih 😭
      <br>
      Ada apa?
    </p>


    <div id="buttons">

      <button
        class="sad"
        onclick="goTo('sedih')"
      >
        Iya... 😭
      </button>


      <button
        class="happy"
        onclick="goTo('bohong')"
      >
        Aku baik-baik aja 😌
      </button>

    </div>


    <div
      class="message"
      id="message"
    ></div>


    <div class="footer">
      dibuat khusus untuk manusia
      yang sedang overthinking 🤡
    </div>

  </div>



  <script>

    /*
    ==================================================
    STATE WEBSITE
    ==================================================
    */

    let currentPage = "awal";

    let endingTimer = null;


    /*
    ==================================================
    HISTORY INITIALIZATION
    ==================================================
    */

    history.replaceState(
      {
        page: "awal"
      },
      "",
      window.location.href
    );


    /*
    ==================================================
    NAVIGASI
    ==================================================
    */

    function goTo(page) {

      currentPage = page;


      history.pushState(
        {
          page: page
        },
        "",
        window.location.href
      );


      render(page);

    }


    /*
    ==================================================
    BACK BUTTON / GESTURE BACK
    ==================================================
    */

    window.addEventListener(
      "popstate",
      function(event) {

        if (
          event.state &&
          event.state.page
        ) {

          currentPage =
            event.state.page;

          render(currentPage);

        }

      }
    );


    /*
    ==================================================
    RENDER PAGE
    ==================================================
    */

    function render(page) {

      clearTimeout(endingTimer);


      switch (page) {

        case "awal":

          renderAwal();

          break;


        case "sedih":

          renderSedih();

          break;


        case "hug":

          renderHug();

          break;


        case "senyum":

          renderSenyum();

          break;


        case "bohong":

          renderBohong();

          break;


        case "bohongLagi":

          renderBohongLagi();

          break;


        default:

          renderAwal();

      }

    }


    /*
    ==================================================
    AWAL
    ==================================================
    */

    function renderAwal() {

      setCharacter("🥺");

      setTitle(
        "Hei... kamu lagi sedih ya?"
      );

      setSubtitle(`
        Kok mukanya begitu sih 😭
        <br>
        Ada apa?
      `);


      setButtons(`

        <button
          class="sad"
          onclick="goTo('sedih')"
        >
          Iya... 😭
        </button>


        <button
          class="happy"
          onclick="goTo('bohong')"
        >
          Aku baik-baik aja 😌
        </button>

      `);


      hideMessage();

    }


    /*
    ==================================================
    SEDIH
    ==================================================
    */

    function renderSedih() {

      setCharacter("😭");

      setTitle(
        "Yaudah sini dulu..."
      );

      setSubtitle(
        "Nangis boleh, lebay dikit juga gapapa."
      );


      setButtons(`

        <button
          class="hug"
          onclick="goTo('hug')"
        >
          HUGGG🫂
        </button>


        <button
          class="happy"
          onclick="goTo('senyum')"
        >
          Coba senyum 😗
        </button>

      `);


      showMessage(`

        <b>Pesan penting 🚨</b>

        <br><br>

        Jangan terlalu keras sama diri sendiri.
        Kalau hari ini berat,
        yaudah istirahat dulu.

        <br><br>

        Besok kita pikirin lagi.

        <br>

        Sekarang jangan overthinking dulu. 😭

      `);

    }


    /*
    ==================================================
    HUG
    ==================================================
    */

    function renderHug() {

      setCharacter("🫂");

      setTitle(
        "HUGGG🫂"
      );

      setSubtitle(
        "Udah. Jangan nangis."
      );


      showMessage(`

        Oke, hug virtual diterima. 🫂

        <br><br>

        Tarik napas...
        <br>

        Buang napas...

        <br><br>

        Nah.

        <br><br>

        Sekarang boleh sedih lagi.

        <br>

        Tapi jangan kelamaan. 😭

      `);


      createHearts();


      /*
      Setelah 3.5 detik,
      berubah menjadi ending.
      */

      endingTimer =
        setTimeout(
          function() {

            setTitle(
              "Oke cukup."
            );

            setSubtitle(
              "Sekarang waktunya berhenti cengeng."
            );


            showMessage(`

              <div class="ending">
                DASAR CENGENG WKWKWK 😭
              </div>

              <br>

              Udah sana minum air.

              <br>

              Terus lanjut hidup lagi. 😭

            `);

          },
          3500
        );

    }


    /*
    ==================================================
    SENYUM
    ==================================================
    */

    function renderSenyum() {

      setCharacter("😊");

      setTitle(
        "Nahhh gitu dong 😭"
      );

      setSubtitle(
        "Senyum dikit ternyata bisa."
      );


      showMessage(`

        Nah, lebih enak dilihat kan? 😭

        <br><br>

        Masalahnya belum selesai sih...

        <br><br>

        Tapi setidaknya sekarang mukanya
        nggak kayak mau kiamat.

        <br><br>

        WKWKWK.

      `);


      createHearts();

    }


    /*
    ==================================================
    BOHONG
    ==================================================
    */

    function renderBohong() {

      setCharacter("🤨");

      setTitle(
        "Yakin???"
      );

      setSubtitle(
        "Kok kayaknya bohong ya..."
      );


      setButtons(`

        <button
          class="sad"
          onclick="goTo('sedih')"
        >
          Yaudah ketahuan 😭
        </button>


        <button
          class="happy"
          onclick="goTo('bohongLagi')"
        >
          BENERAN 😤
        </button>

      `);


      hideMessage();

    }


    /*
    ==================================================
    BOHONG LAGI
    ==================================================
    */

    function renderBohongLagi() {

      setCharacter("🧐");

      setTitle(
        "OHHH..."
      );

      setSubtitle(
        "Kalau gitu kenapa buka website ini? 🤨"
      );


      setButtons(`

        <button
          class="hug"
          onclick="goTo('hug')"
        >
          Yaudah deh 🫂
        </button>

      `);


      hideMessage();

    }


    /*
    ==================================================
    ELEMENT HELPERS
    ==================================================
    */

    function setCharacter(text) {

      document.getElementById(
        "character"
      ).innerHTML = text;

    }


    function setTitle(text) {

      document.getElementById(
        "title"
      ).innerHTML = text;

    }


    function setSubtitle(text) {

      document.getElementById(
        "subtitle"
      ).innerHTML = text;

    }


    function setButtons(html) {

      document.getElementById(
        "buttons"
      ).innerHTML = html;

    }


    function showMessage(html) {

      const message =
        document.getElementById(
          "message"
        );


      message.innerHTML = html;

      message.style.display =
        "block";

    }


    function hideMessage() {

      document.getElementById(
        "message"
      ).style.display =
        "none";

    }


    /*
    ==================================================
    FLOATING EMOJIS
    ==================================================
    */

    function createHearts() {

      const emojis = [

        "💜",
        "🤍",
        "✨",
        "🌸",
        "💫"

      ];


      for (
        let i = 0;
        i < 15;
        i++
      ) {

        const heart =
          document.createElement(
            "div"
          );


        heart.className =
          "heart";


        heart.innerHTML =
          emojis[
            Math.floor(
              Math.random()
              * emojis.length
            )
          ];


        heart.style.left =
          Math.random()
          * 100
          + "vw";


        heart.style.animationDuration =
          (3 +
          Math.random() * 3)
          + "s";


        document.body.appendChild(
          heart
        );


        setTimeout(
          function() {

            heart.remove();

          },
          6000
        );

      }

    }


    /*
    ==================================================
    START
    ==================================================
    */

    render("awal");

  </script>

</body>
</html>
