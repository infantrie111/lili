
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jangan Sedih 🥺</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;

      background:
        radial-gradient(circle at top left, #eadcff, transparent 40%),
        radial-gradient(circle at bottom right, #d8c2ff, transparent 40%),
        #cdb5f7;
    }

    .container {
      width: 90%;
      max-width: 500px;

      background: rgba(255, 255, 255, 0.88);

      padding: 35px 25px;

      border-radius: 30px;

      text-align: center;

      box-shadow:
        0 20px 50px rgba(92, 55, 140, 0.25);

      position: relative;
      z-index: 2;

      animation: muncul 0.8s ease;
    }

    @keyframes muncul {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .character {
      font-size: 85px;
      margin-bottom: 15px;

      animation: goyang 2.5s ease-in-out infinite;
    }

    @keyframes goyang {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-8px) rotate(3deg);
      }
    }

    h1 {
      color: #6941a5;
      margin-bottom: 12px;
      font-size: 27px;
    }

    .subtitle {
      color: #75657f;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    button {
      border: none;
      padding: 13px 22px;
      margin: 6px;

      border-radius: 20px;

      font-size: 15px;
      font-weight: bold;

      cursor: pointer;

      transition: 0.25s;
    }

    button:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 18px rgba(100, 65, 160, 0.2);
    }

    .sad {
      background: #c9b0f2;
      color: #4f3477;
    }

    .happy {
      background: #dfd0fa;
      color: #65469a;
    }

    .hug {
      background: #b99ae8;
      color: white;
    }

    .message {
      display: none;

      margin-top: 22px;
      padding: 20px;

      border-radius: 20px;

      background: #f3ecff;

      color: #695579;

      line-height: 1.7;

      animation: muncul 0.5s ease;
    }

    .ending {
      font-size: 23px;
      font-weight: bold;
      color: #7046a8;
    }

    .heart {
      position: fixed;

      bottom: -40px;

      font-size: 24px;

      pointer-events: none;

      animation: naik 4s linear forwards;
    }

    @keyframes naik {

      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform:
          translateY(-110vh)
          rotate(360deg);

        opacity: 0;
      }
    }

    .footer {
      margin-top: 20px;

      font-size: 12px;

      color: #a28abb;
    }

  </style>
</head>


<body>

  <div class="container">

    <div class="character" id="character">
      🥺
    </div>


    <h1 id="title">
      Hei... kamu lagi sedih ya?
    </h1>


    <p class="subtitle" id="subtitle">
      Kok mukanya begitu sih 😭
      <br>
      Ada apa?
    </p>


    <div id="buttons">

      <button class="sad" onclick="sedih()">
        Iya... 😭
      </button>

      <button class="happy" onclick="bohong()">
        Aku baik-baik aja 😌
      </button>

    </div>


    <div class="message" id="message"></div>


    <div class="footer">
      dibuat khusus untuk manusia yang sedang overthinking 🤡
    </div>

  </div>


<script>

  function sedih() {

    document.getElementById("character").innerHTML = "😭";

    document.getElementById("title").innerHTML =
      "Yaudah sini dulu...";

    document.getElementById("subtitle").innerHTML =
      "Nangis boleh, lebay dikit juga gapapa.";

    document.getElementById("buttons").innerHTML = `

      <button class="hug" onclick="hug()">
        HUGGG🫂
      </button>

      <button class="happy" onclick="senyum()">
        Coba senyum 😗
      </button>

    `;

    showMessage(`
      <b>Pesan penting 🚨</b>
      <br><br>

      Jangan terlalu keras sama diri sendiri.
      Kalau hari ini berat, yaudah istirahat dulu.

      <br><br>

      Besok kita pikirin lagi.
      Sekarang jangan overthinking dulu. 😭
    `);

    createHearts();

  }


  function hug() {

    document.getElementById("character").innerHTML =
      "🫂";

    document.getElementById("title").innerHTML =
      "HUGGG🫂";

    document.getElementById("subtitle").innerHTML =
      "Udah. Jangan nangis.";

    showMessage(`
      Oke, hug virtual diterima. 🫂

      <br><br>

      Tarik napas...
      <br>
      Buang napas...

      <br><br>

      Nah.

      <br><br>

      Sekarang boleh sedih lagi.
      Tapi jangan kelamaan. 😭
    `);

    createHearts();

    setTimeout(() => {

      document.getElementById("title").innerHTML =
        "Oke cukup.";

      document.getElementById("subtitle").innerHTML =
        "Sekarang waktunya berhenti cengeng.";

      document.getElementById("message").innerHTML = `
        <div class="ending">
          DASAR CENGENG WKWKWK 😭
        </div>

        <br>

        Udah sana minum air.
        <br>
        Terus lanjut hidup lagi. 😭
      `;

    }, 3500);

  }


  function bohong() {

    document.getElementById("character").innerHTML =
      "🤨";

    document.getElementById("title").innerHTML =
      "Yakin???";

    document.getElementById("subtitle").innerHTML =
      "Kok kayaknya bohong ya...";

    document.getElementById("buttons").innerHTML = `

      <button class="sad" onclick="sedih()">
        Yaudah ketahuan 😭
      </button>

      <button class="happy" onclick="bohongLagi()">
        BENERAN 😤
      </button>

    `;

  }


  function bohongLagi() {

    document.getElementById("character").innerHTML =
      "🧐";

    document.getElementById("title").innerHTML =
      "OHHH...";

    document.getElementById("subtitle").innerHTML =
      "Kalau gitu kenapa buka website ini? 🤨";

    document.getElementById("buttons").innerHTML = `

      <button class="hug" onclick="hug()">
        Yaudah deh 🫂
      </button>

    `;

  }


  function senyum() {

    document.getElementById("character").innerHTML =
      "😊";

    document.getElementById("title").innerHTML =
      "Nahhh gitu dong 😭";

    document.getElementById("subtitle").innerHTML =
      "Senyum dikit ternyata bisa.";

    showMessage(`
      Nah, lebih enak dilihat kan? 😭

      <br><br>

      Masalahnya belum selesai sih...

      <br>

      Tapi setidaknya sekarang mukanya
      nggak kayak mau kiamat. WKWKWK.
    `);

    createHearts();

  }


  function showMessage(text) {

    const message =
      document.getElementById("message");

    message.innerHTML = text;

    message.style.display = "block";

  }


  function createHearts() {

    const emojis = [
      "💜",
      "🤍",
      "✨",
      "🌸",
      "💫"
    ];

    for (let i = 0; i < 15; i++) {

      const heart =
        document.createElement("div");

      heart.classList.add("heart");

      heart.innerHTML =
        emojis[
          Math.floor(
            Math.random() * emojis.length
          )
        ];

      heart.style.left =
        Math.random() * 100 + "vw";

      heart.style.animationDuration =
        (3 + Math.random() * 3) + "s";

      document.body.appendChild(heart);

      setTimeout(() => {

        heart.remove();

      }, 6000);

    }

  }

</script>

</body>
</html>
